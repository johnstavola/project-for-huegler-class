<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Clock | My Favorites</title>

  <!-- base.css = formatting, layout.css = layout + media queries -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <!-- Day.js core library and its UTC and Timezone plugins (loaded from a CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>

  <!-- nav.js = button navigation shared by every page -->
  <script src="js/nav.js" defer></script>
</head>
<body>
  <!-- Site header with button navigation (same on every page) -->
  <header class="site-header">
    <p class="site-title">My Favorites</p>
    <nav aria-label="Main navigation">
      <!-- Buttons replace links; js/nav.js loads the page named in data-page on click -->
      <ul>
        <li><button type="button" data-page="index.html">Home</button></li>
        <li><button type="button" data-page="author.html">Author</button></li>
        <li><button type="button" data-page="band.html">Band</button></li>
        <li><button type="button" data-page="actor.html" aria-current="page">Actor</button></li>
        <li><button type="button" data-page="worldclock.html">World Clock</button></li>
        <li><button type="button" data-page="events.html">Events</button></li>
        <li><button type="button" data-page="leapyears.html">Leap Years</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>World Clock</h1>
      <p>The current date and time around the world, updated every second.</p>
    </section>

    <!-- worldclock.js inserts the clock items here -->
    <div id="clock-output"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Favorites. Built for a responsive web design assignment.</p>
  </footer>

  <!-- Module script builds the world clock (modules are deferred automatically) -->
  <script type="module" src="js/worldclock.js"></script>
</body>
</html>
