<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coldplay Albums | Favorites</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <!-- nav.js = button navigation (shared by every page); defer runs it after the HTML is parsed -->
  <script src="js/nav.js" defer></script>
  <!-- albums.js = fetches data/coldplay.json and builds the page content; defer runs it after the HTML is parsed -->
  <script src="js/albums.js" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="site-title">My Favorites</p>
    <nav aria-label="Main navigation">
      <!-- Buttons replace links; js/nav.js loads the page named in data-page on click -->
      <ul>
        <li><button type="button" data-page="index.html">Home</button></li>
        <li><button type="button" data-page="author.html">Author</button></li>
        <li><button type="button" data-page="band.html">Band</button></li>
        <li><button type="button" data-page="albums.html" aria-current="page">Albums</button></li>
        <li><button type="button" data-page="actor.html">Actor</button></li>
        <li><button type="button" data-page="worldclock.html">World Clock</button></li>
        <li><button type="button" data-page="events.html">Events</button></li>
        <li><button type="button" data-page="leapyears.html">Leap Years</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <article class="json-page">
      <header class="profile-header">
        <h1>Coldplay Albums</h1>
        <p class="tagline">Everything on this page comes from a JSON file</p>
      </header>

      <!-- Controls: the button fetch()es the JSON file named in data-json -->
      <section class="json-controls">
        <p>Click the button to load the band's data from the server.</p>
        <button type="button" class="panel-button" id="load-json" data-json="data/coldplay.json">Load Album Data</button>
      </section>

      <!-- js/albums.js builds the band summary and the albums table inside this div; aria-live lets screen readers announce the change -->
      <div id="json-output" class="json-output" aria-live="polite">
        <p>No data loaded yet.</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Favorites. Built for a responsive web design assignment.</p>
  </footer>
</body>
</html>
